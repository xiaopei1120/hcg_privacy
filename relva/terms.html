    :root {
      --canvas: #e4eee6;
      --surface: #f7faf7;
      --ink: #1f2a24;
      --muted: #5a6b61;
      --accent: #6f8c6c;
      --line: rgba(31, 42, 36, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--ink);
      background:

        var(--canvas);
      line-height: 1.7;
    }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px 72px; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .toolbar select {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.9rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(31, 42, 36, 0.06);
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; letter-spacing: 0.02em; }
    .meta { margin: 0 0 28px; color: var(--muted); font-size: 0.92rem; }
    h2 { margin: 28px 0 10px; font-size: 1.15rem; color: var(--accent); }
    p, li { font-size: 0.98rem; }
    p { margin: 0 0 12px; }
    ul { margin: 0 0 12px; padding-left: 1.2em; }
    li { margin-bottom: 6px; }
    a { color: var(--accent); }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function list(items) {
      return "<ul>" + items.map((x) => "<li>" + escapeHtml(x) + "</li>").join("") + "</ul>";
    }

    function render(lang) {
      const t = T[lang] || T.en;
      document.documentElement.lang = lang;
      document.title = t.docTitle;
      const mail = "mailto:" + EMAIL;
      const termsHref = TERMS + "?lang=" + encodeURIComponent(lang);
      document.getElementById("content").innerHTML =
        "<h1>" + escapeHtml(t.title) + "</h1>" +
        "<p class=\"meta\">" + escapeHtml(t.meta) + "</p>" +
        "<p>" + escapeHtml(t.intro) + "</p>" +
        "<h2>" + escapeHtml(t.h1) + "</h2>" +
        "<p>" + escapeHtml(t.p1) + "</p>" +
        list(t.l1) +
        "<p>" + escapeHtml(t.p1b) + "</p>" +
        "<h2>" + escapeHtml(t.h2) + "</h2>" +
        list(t.l2) +
        "<h2>" + escapeHtml(t.h3) + "</h2>" +
        "<p>" + escapeHtml(t.p3) + "</p>" +
        list(t.l3) +
        "<h2>" + escapeHtml(t.h4) + "</h2>" +
        list(t.l4) +
        "<h2>" + escapeHtml(t.h5) + "</h2>" +
        "<p>" + escapeHtml(t.p5) + "</p>" +
        "<h2>" + escapeHtml(t.h6) + "</h2>" +
        "<p>" + escapeHtml(t.p6) + "</p>" +
        "<h2>" + escapeHtml(t.h7) + "</h2>" +
        list(t.l7) +
        "<h2>" + escapeHtml(t.h8) + "</h2>" +
        "<p>" + escapeHtml(t.p8) + "</p>" +
        "<h2>" + escapeHtml(t.h9) + "</h2>" +
        "<p>" + escapeHtml(t.p9a) +
          " <a href=\"" + mail + "\">" + escapeHtml(EMAIL) + "</a></p>" +
        "<p>" + escapeHtml(t.p9b) +
          " <a href=\"" + termsHref + "\">" + escapeHtml(t.p9c) + "</a></p>";
    }

    function resolveLang() {
      const params = new URLSearchParams(location.search);
      const q = params.get("lang");
      if (q && T[q]) return q;
      try {
        const saved = localStorage.getItem("relva.legal.lang");
        if (saved && T[saved]) return saved;
      } catch (_) {}
      const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      const lower = String(nav).toLowerCase();
      if (lower.startsWith("zh-hant") || lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-mo")) return "zh-Hant";
      if (lower.startsWith("zh")) return "zh-Hans";
      if (lower.startsWith("ja")) return "ja";
      if (lower.startsWith("es")) return "es";
      if (lower.startsWith("de")) return "de";
      if (lower.startsWith("fr")) return "fr";
      if (lower.startsWith("pt")) return "pt-BR";
      if (lower.startsWith("en")) return "en";
      return "en";
    }

    function setLang(lang) {
      try { localStorage.setItem("relva.legal.lang", lang); } catch (_) {}
      const url = new URL(location.href);
      url.searchParams.set("lang", lang);
      history.replaceState(null, "", url);
      render(lang);
    }

    const select = document.getElementById("lang");
    LANGS.forEach((l) => {
      const opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.label;
      select.appendChild(opt);
    });
    const initial = resolveLang();
    select.value = initial;
    setLang(initial);
    select.addEventListener("change", () => setLang(select.value));
  </script>
