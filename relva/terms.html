    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function list(items) {
      return "<ul>" + items.map((x) => "<li>" + escapeHtml(x) + "</li>").join("") + "</ul>";
    }

    function render(lang) {
      const t = T[lang] || T.en;
      document.documentElement.lang = lang;
      document.title = t.docTitle;
      const mail = "mailto:" + EMAIL;
      const privacyHref = PRIVACY + "?lang=" + encodeURIComponent(lang);
      document.getElementById("content").innerHTML =
        "<h1>" + escapeHtml(t.title) + "</h1>" +
        "<p class=\"meta\">" + escapeHtml(t.meta) + "</p>" +
        "<p>" + escapeHtml(t.intro) + "</p>" +
        "<h2>" + escapeHtml(t.h1) + "</h2>" +
        "<p>" + escapeHtml(t.p1) + "</p>" +
        list(t.l1) +
        "<p>" + escapeHtml(t.p1b) + "</p>" +
        "<h2>" + escapeHtml(t.h2) + "</h2>" +
        list(t.l2) +
        "<h2>" + escapeHtml(t.h3) + "</h2>" +
        list(t.l3) +
        "<h2>" + escapeHtml(t.h4) + "</h2>" +
        "<p>" + escapeHtml(t.p4) + "</p>" +
        "<h2>" + escapeHtml(t.h5) + "</h2>" +
        list(t.l5) +
        "<h2>" + escapeHtml(t.h6) + "</h2>" +
        "<p>" + escapeHtml(t.p6) + "</p>" +
        "<h2>" + escapeHtml(t.h7) + "</h2>" +
        "<p>" + escapeHtml(t.p7a) +
          "<a href=\"" + privacyHref + "\">" + escapeHtml(t.p7b) + "</a>" +
          escapeHtml(t.p7c) + "</p>" +
        "<h2>" + escapeHtml(t.h8) + "</h2>" +
        "<p>" + escapeHtml(t.p8) + "</p>" +
        "<h2>" + escapeHtml(t.h9) + "</h2>" +
        "<p>" + escapeHtml(t.p9a) +
          " <a href=\"" + mail + "\">" + escapeHtml(EMAIL) + "</a></p>";
    }

    function resolveLang() {
      const params = new URLSearchParams(location.search);
      const q = params.get("lang");
      if (q && T[q]) return q;
      try {
        const saved = localStorage.getItem("relva.legal.lang");
        if (saved && T[saved]) return saved;
      } catch (_) {}
      const nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      const lower = String(nav).toLowerCase();
      if (lower.startsWith("zh-hant") || lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-mo")) return "zh-Hant";
      if (lower.startsWith("zh")) return "zh-Hans";
      if (lower.startsWith("ja")) return "ja";
      if (lower.startsWith("es")) return "es";
      if (lower.startsWith("de")) return "de";
      if (lower.startsWith("fr")) return "fr";
      if (lower.startsWith("pt")) return "pt-BR";
      if (lower.startsWith("en")) return "en";
      return "en";
    }

    function setLang(lang) {
      try { localStorage.setItem("relva.legal.lang", lang); } catch (_) {}
      const url = new URL(location.href);
      url.searchParams.set("lang", lang);
      history.replaceState(null, "", url);
      render(lang);
    }

    const select = document.getElementById("lang");
    LANGS.forEach((l) => {
      const opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.label;
      select.appendChild(opt);
    });
    const initial = resolveLang();
    select.value = initial;
    setLang(initial);
    select.addEventListener("change", () => setLang(select.value));
  </script>
